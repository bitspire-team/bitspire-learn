[project]
name = "bitspire-learn"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",    # Line too long (handled by formatter)
    "COM812",  # Trailing comma missing (conflicts with ruff format)
    "ISC001",  # Implicit string concatenation (conflicts with ruff format)
    "D",       # pydocstyle missing docstrings
    "ANN",     # flake8-annotations missing type hints
    "B008",    # function call in default argument (used heavily in FastAPI Depends)
    "INP001",  # Implicit namespace package (don't force __init__.py everywhere)
    "S101",    # Use of assert detected (used widely in tests)
    "PLR2004", # Magic value used in comparison
    "ARG001",  # Unused function argument (FastAPI endpoints/hooks often need rigid signatures)
    "PGH003",  # Blanket type-ignore (used heavily to bypass poor module typings)
    "PLC0415", # Import outside top-level (sometimes necessary for local scope setups)
    "ERA001",  # Commented-out code
    "BLE001",  # Blind except Exception
    "DTZ",     # Datetime timezone issues
    "TRY",     # try/except exceptions formatting
    "SLF001",  # Private member access
    "A002",    # Shadowing builtin (e.g. hash)
    "PLR0913", # Too many arguments
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-nested-blocks = 5

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
    "ty>=0.0.34",
]
