[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copilot-ui"
version = "0.1.0"
dependencies = [
    "streamlit",
    "pandas",
    "sqlalchemy>=2.0.49",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "psycopg2-binary>=2.9.12",
    "tzlocal>=5.3.1",
    "copilot-proxy",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
copilot-proxy = { workspace = true }
