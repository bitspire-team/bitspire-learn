[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-proxy"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
    "httpx[http2]",
    "sseclient-py",
    "sqlalchemy",
    "psycopg2-binary",
    "asyncpg",
    "aiosqlite",
    "python-dotenv",
    "pydantic-settings",
    "tzlocal",
    "alembic",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
markers = ["integration: marks tests as integration tests"]

[tool.uv.sources]
copilot-proxy = { workspace = true }
